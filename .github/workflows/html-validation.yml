name: HTML validation

on:
  pull_request:
    paths:
      - "graha-nine.html"
      - "graha-pariyaya.html"
      - "anga-vijja.html"
      - "app.html"
      - "calendar.html"
      - "day.html"
      - "css/app.css"
      - "js/calendar-app.js"
      - "js/day-astrology.js"
      - "scripts/validate-anga-vijja.py"
      - "scripts/validate-graha-nine.py"
      - "scripts/validate-day-astrology.py"
      - ".github/workflows/html-validation.yml"
  push:
    branches:
      - main
      - feat/dedicated-myanmar-calendar-page
    paths:
      - "graha-nine.html"
      - "graha-pariyaya.html"
      - "anga-vijja.html"
      - "app.html"
      - "calendar.html"
      - "day.html"
      - "css/app.css"
      - "js/calendar-app.js"
      - "js/day-astrology.js"
      - "scripts/validate-anga-vijja.py"
      - "scripts/validate-graha-nine.py"
      - "scripts/validate-day-astrology.py"
      - ".github/workflows/html-validation.yml"

permissions:
  contents: read

jobs:
  validate-astrology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate HTML structure and astrology tables
        run: python scripts/validate-graha-nine.py
      - name: Validate Angavijja charts and mnemonic content
        run: python scripts/validate-anga-vijja.py
      - name: Validate selected-day eight-period astrology
        run: python scripts/validate-day-astrology.py
